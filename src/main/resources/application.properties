# ===============================
# SERVER
# ===============================
server.address=0.0.0.0
server.port=8080

# ===============================
# DATABASE (Railway MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# PYTHON AI ENGINE
# ===============================
python.ai.base-url=${PYTHON_AI_BASE_URL}

# ===============================
# SECURITY
# ===============================
jwt.secjwt.secret=${JWT_SECRET:default_dev_secret_32_chars_long}
frontend.url=${FRONTEND_URL}ret=${JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
